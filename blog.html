<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog | Finance Advising</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="navbar-brand" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07"/>
                </svg>
                <span>Finance Advising</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="header-controls">
                <button id="bg-color-btn" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">Theme</button>
                <span id="datetime-display" class="datetime-badge"></span>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="hero-title" style="font-size: 2.2rem; margin-bottom: 1.5rem;">Blog & Insights</h1>
        
        <section style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.3rem; margin-bottom: 1rem;">Filter Articles</h2>
            <div id="category-buttons" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-outline filter-btn active" data-category="All">All</button>
                <button class="btn btn-outline filter-btn" data-category="Budgeting">Budgeting</button>
                <button class="btn btn-outline filter-btn" data-category="Investing">Investing</button>
                <button class="btn btn-outline filter-btn" data-category="Retirement">Retirement</button>
            </div>
        </section>

        <section id="dynamic-articles-container" class="bento-grid" style="margin-bottom: 3rem;">
        </section>

        <section>
            <h2 style="font-size: 1.5rem; margin-bottom: 1.25rem;">Gallery</h2>
            <div class="custom-carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active"><img src="images/galery1.jpg" class="gallery-photo" alt="Gallery 1"></div>
                    <div class="carousel-item"><img src="images/galery2.jpg" class="gallery-photo" alt="Gallery 2"></div>
                    <div class="carousel-item"><img src="images/galery3.jpg" class="gallery-photo" alt="Gallery 3"></div>
                    <div class="carousel-item"><img src="images/galery4.jpg" class="gallery-photo" alt="Gallery 4"></div>
                    <div class="carousel-item"><img src="images/galery5.jpg" class="gallery-photo" alt="Gallery 5"></div>
                    <div class="carousel-item"><img src="images/galery6.jpg" class="gallery-photo" alt="Gallery 6"></div>
                    <div class="carousel-item"><img src="images/galery7.jpg" class="gallery-photo" alt="Gallery 7"></div>
                    <div class="carousel-item"><img src="images/galery8.jpg" class="gallery-photo" alt="Gallery 8"></div>
                    <div class="carousel-item"><img src="images/galery9.jpg" class="gallery-photo" alt="Gallery 9"></div>
                </div>
                <button class="carousel-control carousel-control-prev" type="button">&#10094;</button>
                <button class="carousel-control carousel-control-next" type="button">&#10095;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>2026 Made by Meirkhan Kulantayev, Nurzhan Zeinulla</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
