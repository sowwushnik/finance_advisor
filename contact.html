<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Finance Advising</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="navbar-brand" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07"/>
                </svg>
                <span>Finance Advising</span>
            </a>
            <div class="header-controls">
            <button id="bg-color-btn" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">Theme</button>
            <span id="datetime-display" class="datetime-badge"></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Contact Us</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">Please fill out all required fields below.</p>
            
            <form id="contact-form">
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input class="form-control" type="text" id="name" name="name" placeholder="John Doe">
                    <span id="name-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input class="form-control" type="text" id="email" name="email" placeholder="name@example.com">
                    <span id="email-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input class="form-control" type="password" id="password" name="password" placeholder="At least 6 characters">
                    <span id="password-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input class="form-control" type="password" id="confirm-password" name="confirm-password" placeholder="Repeat password">
                    <span id="confirm-password-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="topic" class="form-label">Topic</label>
                    <select class="form-select" id="topic" name="topic">
                        <option value="">Select a topic...</option>
                        <option value="budgeting">Budgeting</option>
                        <option value="investing">Investing</option>
                        <option value="retirement">Retirement planning</option>
                    </select>
                    <span id="topic-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="4" placeholder="Your message..."></textarea>
                    <span id="message-error" class="error-message"></span>
                </div>

                <button class="btn btn-success" type="submit" style="width: 100%;">Send Message</button>
                <p id="form-status" style="margin-top: 1rem; font-weight: 500; font-size: 0.9rem; text-align: center;"></p>
            </form>
        </div>
    </main>

    <footer>
        <p>2026 Made by Meirkhan Kulantayev, Nurzhan Zeinulla</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
